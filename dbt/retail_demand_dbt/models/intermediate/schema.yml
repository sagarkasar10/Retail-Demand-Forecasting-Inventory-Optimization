version: 2

models:

  - name: int_daily_sales
    description: >
      M5 sales data converted from wide daily columns
      into one record per item-store-date.

    columns:

      - name: id
        tests:
          - not_null

      - name: item_id
        tests:
          - not_null

      - name: store_id
        tests:
          - not_null

      - name: date
        tests:
          - not_null

      - name: sales
        tests:
          - not_null




