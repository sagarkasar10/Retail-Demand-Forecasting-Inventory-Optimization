version: 2

models:

  - name: int_sales_calendar_mapping
    description: >
      Maps each M5 daily sales column to its corresponding
      calendar date and M5 week.
    columns:
      - name: day_number
        description: "Sequential M5 day number."
        tests:
          - not_null
          - unique

      - name: date
        description: "Calendar date."
        tests:
          - not_null

      - name: wm_yr_wk
        description: "M5 week identifier."
        tests:
          - not_null

  - name: int_daily_sales
    description: >
      Converts M5 wide-format daily sales columns into
      long-format item-store-date records.
    meta:
      grain: "One row per item-store-date"
      upstream_models:
        - stg_sales
        - stg_calendar
    columns:
      - name: id
        description: "Item-store combination."

      - name: item_id
        description: "Product identifier."

      - name: dept_id
        description: "Department identifier."

      - name: cat_id
        description: "Category identifier."

      - name: store_id
        description: "Store identifier."

      - name: state_id
        description: "State identifier."

      - name: date
        description: "Sales date."

      - name: sales
        description: "Units sold on the date."

  - name: int_sales_with_calendar
    description: >
      Enriches daily sales with calendar, event,
      seasonality and SNAP information.
    meta:
      grain: "One row per item-store-date"
      upstream_models:
        - int_daily_sales
        - stg_calendar

  - name: int_sales_with_prices
    description: >
      Enriches sales and calendar data with item-store
      weekly selling prices.
    meta:
      grain: "One row per item-store-date"
      upstream_models:
        - int_sales_with_calendar
        - stg_prices

  - name: int_sales_events
    description: >
      Consolidates event information and creates an
      event-day indicator.
    meta:
      grain: "One row per item-store-date"
      upstream_models:
        - int_sales_with_prices